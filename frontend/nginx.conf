resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Resolved lazily via a variable (not at config-load time) so nginx
        # still starts even if the "backend" service isn't up/resolvable yet.
        # IMPORTANT: proxy_pass has no URI part here on purpose — when a
        # variable is used, nginx does NOT merge the matched location prefix
        # into a literal URI written after it (it would send that literal
        # path, unchanged, for every request). With no URI part at all, the
        # full original request URI (e.g. /api/departments) is forwarded
        # as-is, which matches the backend's own "/api" global route prefix.
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
